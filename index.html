<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة النظام الشمسي</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>☀️ حاسبة النظام الشمسي</h1>
            <p>احسب احتياجاتك من الألواح الشمسية وتكلفتها وفترة استرداد رأس المال</p>
        </header>

        <!-- قسم المدخلات -->
        <div class="card input-card">
            <h2>📥 أدخل بياناتك</h2>
            
            <label for="demand">الاستهلاك اليومي (ك.و.س/يوم):</label>
            <input type="number" id="demand" placeholder="مثال: 25" min="1">
            
            <label for="area">المساحة المتاحة للألواح (م²):</label>
            <input type="number" id="area" placeholder="مثال: 30" min="1">
            
            <label for="region">المنطقة:</label>
            <select id="region">
                <option value="5.5">الرياض — 5.5 ساعة شمس ذروة</option>
                <option value="5.8">المدينة المنورة — 5.8 ساعة شمس ذروة</option>
                <option value="5.7">مكة المكرمة — 5.7 ساعة شمس ذروة</option>
                <option value="5.4">المنطقة الشرقية — 5.4 ساعة شمس ذروة</option>
                <option value="6.0">منطقة نجران — 6.0 ساعة شمس ذروة</option>
            </select>
            
            <label for="price">متوسط سعر الكهرباء (هللة/ك.و.س):</label>
            <input type="number" id="price" placeholder="مثال: 18" min="10">
            
            <label>نوع النظام:</label>
            <div class="radio-group">
                <label><input type="radio" name="systemType" value="grid" checked> متصل بالشبكة</label>
                <label><input type="radio" name="systemType" value="offgrid"> منفصل عن الشبكة</label>
            </div>
            
            <button onclick="calculate()">🔍 احسب النظام</button>
        </div>

        <!-- قسم النتائج -->
        <div class="card results-card" id="results" style="display: none;">
            <h2>📊 النتائج</h2>
            <div id="output"></div>
        </div>

        <!-- تذييل الصفحة -->
        <footer>
            <p>مشروع تخرج — تخصص هندسة الطاقة المتجددة</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
